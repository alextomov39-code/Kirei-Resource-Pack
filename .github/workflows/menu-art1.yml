name: Publish abilityaccents1-20261027 player pack
on:
  push:
    branches: [abilityaccents1-20261027-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and verify player assets
        run: |
          python - <<'PY'
          import urllib.request,zipfile,hashlib,json,uuid
          from pathlib import Path
          urllib.request.urlretrieve('https://github.com/alextomov39-code/Kirei-Resource-Pack/releases/download/enderman-mimic1-20261027/Kirei-Unified.zip','baseline.zip')
          assert hashlib.sha256(Path('baseline.zip').read_bytes()).hexdigest()=='b05f1bb616f5d75bb2a38a30326d423c0ab0f46c9c8e0c26bed5c881cf51cb0d'
          with zipfile.ZipFile('baseline.zip') as old,zipfile.ZipFile('Accents-Patch.zip') as patch,zipfile.ZipFile('Kirei-Unified.zip','w',zipfile.ZIP_DEFLATED) as out:
              for n in old.namelist():out.writestr(n,patch.read(n) if n in patch.namelist() else old.read(n))
              for n in patch.namelist():
                  if n not in old.namelist():out.writestr(n,patch.read(n))
          with zipfile.ZipFile('Kirei-Unified.zip') as z:
              assert z.testzip() is None
              h=hashlib.sha256()
              for n in sorted(z.namelist()):h.update(n.encode()+b'\0'+hashlib.sha256(z.read(n)).digest())
              assert h.hexdigest()=='63887f0a681bc30436b1f21330b93ef8bfaaeade058aa9cb2d4254a20e25a9a7'
          b=Path('Kirei-Unified.zip').read_bytes();s=hashlib.sha1(b).hexdigest()
          print('PACK_RESULT '+json.dumps(dict(sha1=s,sha256=hashlib.sha256(b).hexdigest(),uuid=str(uuid.uuid5(uuid.NAMESPACE_URL,'kirei/abilityaccents1-20261027/'+s)),contentSha256=h.hexdigest())))
          PY
      - name: Publish verified pack
        run: |
          gh release upload abilityaccents1-20261027 Kirei-Unified.zip
          gh release edit abilityaccents1-20261027 --draft=false --title 'Kirei ability accents' --notes 'Phoenix rebirth eruption and Gorilla landing rubble; preserves all previous assets.'
        env:
          GH_TOKEN: ${{ github.token }}
