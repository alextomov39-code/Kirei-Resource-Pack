name: Publish enderman-mimic1-20261027 player pack
on:
  push:
    branches: [enderman-mimic1-20261027-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and verify player assets
        run: |
          python - <<'PY'
          import urllib.request,zipfile,hashlib,json,uuid
          from pathlib import Path
          urllib.request.urlretrieve('https://github.com/alextomov39-code/Kirei-Resource-Pack/releases/download/mvp-gui3-20261026/Kirei-MVP-GUI3-Unified-Pack.zip','baseline.zip')
          assert hashlib.sha256(Path('baseline.zip').read_bytes()).hexdigest()=='fd978a79e13169351a105b1dce2b2d21f855f2fbbf7bba33892f6d568466ec50'
          with zipfile.ZipFile('baseline.zip') as old,zipfile.ZipFile('Title-Patch.zip') as patch,zipfile.ZipFile('Kirei-Unified.zip','w',zipfile.ZIP_DEFLATED) as out:
              for n in old.namelist():out.writestr(n,patch.read(n) if n in patch.namelist() else old.read(n))
              for n in patch.namelist():
                  if n not in old.namelist():out.writestr(n,patch.read(n))
          with zipfile.ZipFile('Kirei-Unified.zip') as z:
              assert z.testzip() is None
              h=hashlib.sha256()
              for n in sorted(z.namelist()):h.update(n.encode()+b'\0'+hashlib.sha256(z.read(n)).digest())
              assert h.hexdigest()=='6b21271bd4f517c0bb70fd81d6d70e61945466ea2e6bd962b5cef1e21dfb883e'
          b=Path('Kirei-Unified.zip').read_bytes();s=hashlib.sha1(b).hexdigest()
          print('PACK_RESULT '+json.dumps(dict(sha1=s,sha256=hashlib.sha256(b).hexdigest(),uuid=str(uuid.uuid5(uuid.NAMESPACE_URL,'kirei/enderman-mimic1-20261027/'+s)),contentSha256=h.hexdigest())))
          PY
      - name: Publish verified pack
        run: |
          gh release upload enderman-mimic1-20261027 Kirei-Unified.zip
          gh release edit enderman-mimic1-20261027 --draft=false --title 'Kirei Enderman Mimic mystery box' --notes 'Adds the Beyond Mimic mystery box with idle and occasional attack animation; preserves previous cosmetics.'
        env:
          GH_TOKEN: ${{ github.token }}
