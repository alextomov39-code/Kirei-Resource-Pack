name: Publish menu-art1-20261026 player pack
on:
  push:
    branches: [menu-art1-20261026-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and verify player assets
        run: |
          python - <<'PY'
          import urllib.request,zipfile,hashlib,json,uuid
          from pathlib import Path
          urllib.request.urlretrieve('https://github.com/alextomov39-code/Kirei-Resource-Pack/releases/download/mvp-gui3-20261026/Kirei-MVP-GUI3-Unified-Pack.zip','baseline.zip')
          assert hashlib.sha256(Path('baseline.zip').read_bytes()).hexdigest()=='fd978a79e13169351a105b1dce2b2d21f855f2fbbf7bba33892f6d568466ec50'
          with zipfile.ZipFile('baseline.zip') as old,zipfile.ZipFile('Menu-Art-Patch.zip') as patch,zipfile.ZipFile('Kirei-Unified.zip','w',zipfile.ZIP_DEFLATED) as out:
              for n in old.namelist():out.writestr(n,patch.read(n) if n in patch.namelist() else old.read(n))
              for n in patch.namelist():
                  if n not in old.namelist():out.writestr(n,patch.read(n))
          with zipfile.ZipFile('Kirei-Unified.zip') as z:
              assert z.testzip() is None
              h=hashlib.sha256()
              for n in sorted(z.namelist()):h.update(n.encode()+b'\0'+hashlib.sha256(z.read(n)).digest())
              assert h.hexdigest()=='76d590ec900008229e415ad5c03973259b14c2996b08ec3cde2eac1c17b4d80a'
          b=Path('Kirei-Unified.zip').read_bytes();s=hashlib.sha1(b).hexdigest()
          print('PACK_RESULT '+json.dumps(dict(sha1=s,sha256=hashlib.sha256(b).hexdigest(),uuid=str(uuid.uuid5(uuid.NAMESPACE_URL,'kirei/menu-art1-20261026/'+s)),contentSha256=h.hexdigest())))
          PY
      - name: Publish verified pack
        run: |
          gh release upload menu-art1-20261026 Kirei-Unified.zip
          gh release edit menu-art1-20261026 --draft=false --title 'Kirei Menu Art - Shop and Navigator' --notes 'Marble Shop heading, supplied Navigator icons on Cosmetics cards, and consistent carved Back buttons. Preserves the complete MVP GUI3 combined pack.'
        env:
          GH_TOKEN: ${{ github.token }}
