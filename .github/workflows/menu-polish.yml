name: Publish Phoenix rebirth pack
on:
  push:
    branches: [phoenixrebirth1-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python menu-polish/assemble.py
      - run: gh release upload phoenixrebirth1 Kirei-Phoenix-Update-Pack.zip phoenix-checksums.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit phoenixrebirth1 --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
