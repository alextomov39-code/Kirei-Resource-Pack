name: Publish menu polish pack
on:
  push:
    branches: [menupolish1-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python menu-polish/assemble.py
      - run: gh release upload menupolish1 Kirei-Menu-Polish-Pack.zip menu-polish-checksums.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
