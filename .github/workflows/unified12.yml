name: Publish unified12 player pack
on:
  push:
    branches: [unified12-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and verify player assets
        run: |
          python - <<'PY'
          import urllib.request,zipfile,hashlib,json,uuid
          from pathlib import Path
          urllib.request.urlretrieve('https://github.com/alextomov39-code/Kirei-Resource-Pack/releases/download/unified11/Kirei-Unified.zip','baseline.zip')
          assert hashlib.sha256(Path('baseline.zip').read_bytes()).hexdigest()=='d1d1da257cef3d91c1236fb6d1fb94f016db937f49781f4cc3073fa89cbaf5a8'
          with zipfile.ZipFile('baseline.zip') as old,zipfile.ZipFile('Dragon-Surface-Patch.zip') as patch,zipfile.ZipFile('Kirei-Unified.zip','w',zipfile.ZIP_DEFLATED) as out:
              for n in old.namelist():out.writestr(n,patch.read(n) if n in patch.namelist() else old.read(n))
              for n in patch.namelist():
                  if n not in old.namelist():out.writestr(n,patch.read(n))
          with zipfile.ZipFile('Kirei-Unified.zip') as z:
              assert z.testzip() is None
              h=hashlib.sha256()
              for n in sorted(z.namelist()):h.update(n.encode()+b'\0'+hashlib.sha256(z.read(n)).digest())
              assert h.hexdigest()=='80354470042c5a49b58b24b8947ae6a3dcc1dfba1d7c42fc129017f9445767a2'
          b=Path('Kirei-Unified.zip').read_bytes();s=hashlib.sha1(b).hexdigest()
          print('PACK_RESULT '+json.dumps(dict(sha1=s,sha256=hashlib.sha256(b).hexdigest(),uuid=str(uuid.uuid5(uuid.NAMESPACE_URL,'kirei/unified12/'+s)),contentSha256=h.hexdigest())))
          PY
      - name: Publish verified pack
        run: |
          gh release upload unified12 Kirei-Unified.zip
          gh release edit unified12 --draft=false --title 'Kirei Unified 12 - Faithful dragon surfaces' --notes 'Adds four team dragon variants, Magic, Smoke, Splash and animated portal assets. Preserves the complete existing combined pack.'
        env:
          GH_TOKEN: ${{ github.token }}
