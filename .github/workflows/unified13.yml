name: Publish unified13 player pack
on:
  push:
    branches: [unified13-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and verify player assets
        run: |
          python - <<'PY'
          import urllib.request,zipfile,hashlib,json,uuid
          from pathlib import Path
          urllib.request.urlretrieve('https://github.com/alextomov39-code/Kirei-Resource-Pack/releases/download/guardian-wolf1-20261025/Kirei-Guardian-Wolf1-Unified-Pack.zip','baseline.zip')
          assert hashlib.sha256(Path('baseline.zip').read_bytes()).hexdigest()=='45986e76b4b898783dcffb42431abf66a8248a2a035479af27e38c43bcb0f80a'
          with zipfile.ZipFile('baseline.zip') as old,zipfile.ZipFile('Dragon-Surface-Patch.zip') as patch,zipfile.ZipFile('Kirei-Unified.zip','w',zipfile.ZIP_DEFLATED) as out:
              for n in old.namelist():out.writestr(n,patch.read(n) if n in patch.namelist() else old.read(n))
              for n in patch.namelist():
                  if n not in old.namelist():out.writestr(n,patch.read(n))
          with zipfile.ZipFile('Kirei-Unified.zip') as z:
              assert z.testzip() is None
              h=hashlib.sha256()
              for n in sorted(z.namelist()):h.update(n.encode()+b'\0'+hashlib.sha256(z.read(n)).digest())
              assert h.hexdigest()=='b2a20fa4f1cd839e4802c411849a135b8a19e792e0dc51fcb63336a3380a551b'
          b=Path('Kirei-Unified.zip').read_bytes();s=hashlib.sha1(b).hexdigest()
          print('PACK_RESULT '+json.dumps(dict(sha1=s,sha256=hashlib.sha256(b).hexdigest(),uuid=str(uuid.uuid5(uuid.NAMESPACE_URL,'kirei/unified13/'+s)),contentSha256=h.hexdigest())))
          PY
      - name: Publish verified pack
        run: |
          gh release upload unified13 Kirei-Unified.zip
          gh release edit unified13 --draft=false --title 'Kirei Unified 13 - Faithful dragon surfaces' --notes 'Corrects dragon skin colors and double-sided surfaces. Preserves Guardian/Wolf and all existing combined assets.'
        env:
          GH_TOKEN: ${{ github.token }}
