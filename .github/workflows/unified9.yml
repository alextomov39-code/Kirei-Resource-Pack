name: Publish unified9 player pack
on:
  push:
    branches: [unified9-build]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and verify player assets
        run: |
          python - <<'PY'
          import urllib.request,zipfile,hashlib,json,uuid
          from pathlib import Path
          urllib.request.urlretrieve('https://github.com/alextomov39-code/Kirei-Resource-Pack/releases/download/unified8-merged/Kirei-Unified.zip','baseline.zip')
          assert hashlib.sha256(Path('baseline.zip').read_bytes()).hexdigest()=='fea6704fc5e048b33ae83f2cb4fed8d955a73710bd4291fbd9cf7199afd11421'
          with zipfile.ZipFile('baseline.zip') as old,zipfile.ZipFile('Meteor-Patch.zip') as patch,zipfile.ZipFile('Kirei-Unified.zip','w',zipfile.ZIP_DEFLATED) as out:
              for n in old.namelist():out.writestr(n,patch.read(n) if n in patch.namelist() else old.read(n))
              for n in patch.namelist():
                  if n not in old.namelist():out.writestr(n,patch.read(n))
          with zipfile.ZipFile('Kirei-Unified.zip') as z:
              assert z.testzip() is None
              h=hashlib.sha256()
              for n in sorted(z.namelist()):h.update(n.encode()+b'\0'+hashlib.sha256(z.read(n)).digest())
              assert h.hexdigest()=='6a34e6724f030c1d8d3bf930865d73370f52234dbf21f2f866e32e5a170f3795'
          b=Path('Kirei-Unified.zip').read_bytes();s=hashlib.sha1(b).hexdigest()
          print('PACK_RESULT '+json.dumps(dict(sha1=s,sha256=hashlib.sha256(b).hexdigest(),uuid=str(uuid.uuid5(uuid.NAMESPACE_URL,'kirei/unified9/'+s)),contentSha256=h.hexdigest())))
          PY
      - name: Publish verified pack
        run: |
          gh release upload unified9 Kirei-Unified.zip
          gh release edit unified9 --draft=false --title 'Kirei Unified 9 - Meteor and Dragon helmet' --notes 'Adds the authored meteor impact and projectile assets; removes the Dragon helmet jaw and lowers its fit. Preserves the complete current combined pack.'
        env:
          GH_TOKEN: ${{ github.token }}
